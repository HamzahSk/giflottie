name: Convert GIF to Lottie JSON

on:
  push:
    paths:
      - 'inputs/**' # Otomatis jalan saat ada file baru di folder inputs/
      - 'convert.py'
  workflow_dispatch: # Memungkinkan untuk trigger tombol 'Run workflow' secara manual di GitHub

jobs:
  convert:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Izin untuk meng-commit hasil konversi kembali ke repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process All GIFs
        run: |
          mkdir -p outputs
          # Melakukan iterasi ke semua file .gif di dalam folder inputs/
          for file in inputs/*.gif; do
            if [ -f "$file" ]; then
              filename=$(basename -- "$file")
              filename_no_ext="${filename%.*}"
              echo "Memproses: $file -> outputs/${filename_no_ext}.json"
              python convert.py "$file" "outputs/${filename_no_ext}.json"
            fi
          done

      - name: Commit & Push Output Lottie JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Auto-generated Lottie JSON from GIF"
          file_pattern: 'outputs/*.json'

      - name: Upload Artifact (Opsional)
        uses: actions/upload-artifact@v4
        with:
          name: lottie-files
          path: outputs/
          